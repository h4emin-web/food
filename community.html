    <main class="community-page">
      <section class="community-hero po-board-hero" aria-labelledby="community-title">
        <div class="po-board-hero-inner">
          <h1 id="community-title">원료문의</h1>
          <p class="po-board-desc">공급사 회원이 등록한 원료를 확인하고,<br class="po-br" /> 공급사 회원에게 회신을 받을 수 있는 공간입니다.</p>
          <button class="po-btn po-btn-accent" type="button" data-click-target="#communityWriteButton">문의 등록하기 <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
          <ol class="po-board-steps" aria-label="진행 순서"><li><span>1</span>문의 등록</li><li><span>2</span>공급사 회원 댓글</li><li><span>3</span>쪽지로 상담</li></ol>
        </div>
      </section>

      <section class="community-section" id="community">
        <div class="community-layout">
          <div class="community-main">
            <div class="sector-tabs community-sector-tabs" role="tablist" aria-label="문의 분야">
              <button class="active" type="button" data-community-sector="전체">전체보기</button>
              <button type="button" data-community-sector="식품">식품</button>
              <button type="button" data-community-sector="제약">제약</button>
              <button type="button" data-community-sector="화장품">화장품</button>
            </div>
            <div class="community-toolbar">
              <label class="community-search">
                <i data-lucide="search"></i>
                <input id="communitySearch" type="search" placeholder="원료 문의 검색" />
              </label>
              <button class="outline-button community-write-button" type="button" id="communityWriteButton">
                <i data-lucide="square-pen"></i>
                문의 등록
              </button>
            </div>
            <form class="community-write-form" id="communityWriteForm" hidden>
              <div class="form-grid">
                <label>
                  <span>문의 제목</span>
                  <input id="communityPostTitle" type="text" placeholder="예: 알룰로스 원료 문의" required />
                </label>
                <!-- The author is always the signed-in member (script.js saves getDisplayName(member)). -->
                <input id="communityPostAuthor" type="hidden" />
                <label>
                  <span>문의 분야</span>
                  <select id="communityPostSector" required>
                    <option value="식품">식품</option>
                    <option value="제약">제약</option>
                    <option value="화장품">화장품</option>
                  </select>
                </label>
              </div>
              <label>
                <span>문의 내용</span>
                <textarea id="communityPostDesc" placeholder="필요한 원료명, 규격, 용도, 희망 수량 등을 입력하세요" required></textarea>
              </label>
              <div class="form-actions">
                <button class="outline-button" type="button" id="communityWriteCancel">취소</button>
                <button class="primary-button" type="submit">등록하기</button>
              </div>
              <p class="form-message" id="communityWriteMessage" aria-live="polite"></p>
            </form>
            <div class="community-list" id="communityList" aria-live="polite"></div>
          </div>
        </div>
